name: Build IPA from your own Spotify IPA

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner to build on (macos-latest; macos-15-intel when Apple silicon runners are busy)"
        default: macos-latest
        type: string
      ipa_url:
        description: "Direct link to a decrypted Spotify IPA"
        required: true
        type: string
      upload_method:
        description: "Where to put the result"
        default: artifacts
        type: choice
        options: [artifacts, filebin, both]
      safari_extension:
        description: "Add the Open in Spotify Safari extension (BillyCurtis/OpenSpotifySafariExtension)"
        default: true
        type: boolean
      old_icon:
        description: "Use the glass app icon of Spotify 9.1.78 (assets/old-icon.tar.enc, needs the OLD_ICON_KEY secret)"
        default: true
        type: boolean
      icon_ipa_url:
        description: "Optional: a direct link to another Spotify IPA whose app icon to use instead"
        required: false
        type: string
      bundle_id:
        description: "Bundle ID to set, matching the App ID of the certificate that signs it (empty keeps com.spotify.client)"
        default: "app.asparagus7684.aurora3945"
        required: false
        type: string

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v5

      - uses: levibostian/action-hide-sensitive-inputs@v1

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download IPA
        run: |
          mkdir -p ipa
          curl -fsSL --retry 6 --retry-delay 15 --retry-all-errors --connect-timeout 30 "${{ inputs.ipa_url }}" -o ipa/spotify.ipa
          case "$(file --mime-type -b ipa/spotify.ipa)" in application/zip|application/x-ios-app) ;; *) echo "::error::Not an IPA"; exit 1 ;; esac

      # The app icon of another Spotify IPA (Old icon): its renditions moved into this one's Assets.car by
      # scripts/icon-transplant.m, through CoreUI, and its loose AppIcon PNGs copied over. Nothing else of the
      # other IPA is used. When the move fails the build goes on with Spotify's own icon.
      # The 9.1.78 icon's files are kept encrypted in the repo, since it is public: the key is a secret of the repo's.
      - name: Use the other IPA's app icon
        if: inputs.icon_ipa_url != '' || inputs.old_icon
        env:
          OLD_ICON_KEY: ${{ secrets.OLD_ICON_KEY }}
        run: |
          set -o pipefail
          mkdir -p icon/old/Payload/Old.app icon/new
          if [ -n "${{ inputs.icon_ipa_url }}" ]; then
            rm -rf icon/old && mkdir -p icon/old
            curl -fsSL "${{ inputs.icon_ipa_url }}" -o icon/old.ipa
            unzip -q icon/old.ipa 'Payload/*.app/Assets.car' 'Payload/*.app/AppIcon*' -d icon/old
          elif [ -n "$OLD_ICON_KEY" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in assets/old-icon.tar.enc -pass env:OLD_ICON_KEY | tar -x -C icon/old/Payload/Old.app
          else
            echo "::warning title=Old icon::The OLD_ICON_KEY secret is not set, so Spotify's own icon stays"
            exit 0
          fi
          (cd icon/new && unzip -q ../../ipa/spotify.ipa)
          APP="$(ls -d icon/new/Payload/*.app)"
          OLD="$(ls -d icon/old/Payload/*.app)"
          clang -fobjc-arc -framework Foundation -framework CoreGraphics -F/System/Library/PrivateFrameworks -framework CoreUI \
            scripts/icon-transplant.m -o icon/icon-transplant
          cp "$APP/Assets.car" icon/Assets.car
          if icon/icon-transplant "$OLD/Assets.car" icon/Assets.car 2>&1 | tee icon/log.txt; then
            cp icon/Assets.car "$APP/Assets.car"
            cp "$OLD"/AppIcon*.png "$APP/" 2>/dev/null || true
            (cd icon/new && rm -f ../../ipa/spotify.ipa && zip -qr -y ../../ipa/spotify.ipa Payload)
            xcrun --sdk iphoneos assetutil --info "$APP/Assets.car" > icon/info.json 2>/dev/null || true
            python3 -c 'import json; d=json.load(open("icon/info.json")); print("\n".join(sorted(set(str(e.get("Name")) + " " + str(e.get("AssetType")) for e in d[1:] if str(e.get("Name", "")).startswith("AppIcon")))))' >> icon/log.txt 2>/dev/null || true
            echo "::notice title=Old icon::$(sed -e 's/%/%25/g' icon/log.txt | awk 'BEGIN{ORS="%0A"} {print}')"
          else
            echo "::warning title=Old icon not moved::$(sed -e 's/%/%25/g' icon/log.txt | awk 'BEGIN{ORS="%0A"} {print}')"
          fi

      # A prebuilt Safari web extension that sends open.spotify.com pages to the app. Pinned to a commit,
      # since it is a binary from another repo. Its content script opens spotify://eevee/... links, which
      # only EeveeSpotify answers, so it is rewritten to vitrine://<host>/<path>?<query>, the link type only this build
      # claims (Shared/Navigation/VitrineLinks.x). spotify: would go to the App Store Spotify if installed.
      - name: Fetch the Open in Spotify Safari extension
        if: inputs.safari_extension
        run: |
          git clone --quiet https://github.com/BillyCurtis/OpenSpotifySafariExtension.git out/safari-ext
          git -C out/safari-ext checkout --quiet 6523fcd3a45796beb89ce82f3f9ba032c85ae837
          APPEX="out/safari-ext/OpenSpotifySafariExtension.appex"
          python3 - "$APPEX/content.js" <<'PY'
          import sys
          path = sys.argv[1]
          src = open(path).read()
          old = 'window.location.href = "spotify://eevee/" + window.location.host + window.location.pathname'
          new = ('window.location.href = "vitrine://" + window.location.host + window.location.pathname '
                 '+ window.location.search')
          if old not in src:
              sys.exit("content.js changed upstream; update this step")
          open(path, "w").write(src.replace(old, new))
          # spotify.link short links too, which most share sheets hand out now.
          manifest = path.replace("content.js", "manifest.json")
          m = open(manifest).read()
          m_old = '"*://spotify.app.link/*" ]'
          if m_old not in m:
              sys.exit("manifest.json changed upstream; update this step")
          open(manifest, "w").write(m.replace(m_old, '"*://spotify.app.link/*", "*://spotify.link/*" ]'))
          PY
          echo "EXTRA_FILES=$PWD/$APPEX" >> "$GITHUB_ENV"

      # scripts/pipeline.sh hands BUNDLE_ID to cyan -b, which renames the app and every extension in
      # PlugIns/ (com.spotify.client.* -> <bundle id>.*), the Safari extension included.
      - name: make release
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
          # On past a file that fails, so one run shows every file's errors.
          MAKEFLAGS: -k
        run: |
          set -o pipefail
          make release 2>&1 | tee build.log || {
            # The compiler's errors as annotations, so they show on the run's page without opening the log.
            grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - uses: actions/upload-artifact@v5
        if: inputs.upload_method != 'filebin'
        with:
          name: vitrine.ipa
          path: out/*.ipa
          if-no-files-found: error

      - name: Upload to filebin.net
        if: inputs.upload_method != 'artifacts'
        run: |
          BIN="vitrine-${{ github.run_id }}"
          echo "### filebin.net download" >> "$GITHUB_STEP_SUMMARY"
          for f in out/*.ipa; do
            curl -fsS -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "https://filebin.net/$BIN/$(basename "$f")" >/dev/null
            echo "- https://filebin.net/$BIN/$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "- _filebin deletes bins after a few days of inactivity, download promptly._" >> "$GITHUB_STEP_SUMMARY"
